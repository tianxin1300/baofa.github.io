        if (S.draft.disease !== 'tumor')
            delete S.draft.sub;
    }
    else if (act === 'create') {
        const d = S.draft;
        d.member = document.getElementById('mn').value.trim();
        const r = document.querySelector('input[name=ag]:checked');
        if (r)
            d.age = r.value;
        if (!d.member) {
            alert('请填写成员称呼');
            return;
        }
        if (!d.disease) {
            alert('请选择病种');
            return;
        }
        if (d.disease === 'rare' && !d.age) {
            alert('请选择儿童或成人');
            return;
        }
        if (d.disease === 'tumor' && !d.sub) {
            alert('请选择肿瘤类型');
            return;
        }
        const n = { id: 'p' + Date.now(), member: d.member, disease: d.disease === 'tumor' && SUBD[d.sub] ? SUBD[d.sub] : d.disease, sub: d.disease === 'tumor' && !SUBD[d.sub] ? d.sub : undefined, age: d.age, data: {} };
        S.profiles.push(n);
        S.cur = n.id;
        S.view = 'list';
        save();
    }
    else if (act === 'addrow') {
        (p.data[b.dataset.f] = p.data[b.dataset.f] || []).push({});
        save();
    }
    else if (act === 'rm') {
        p.data[b.dataset.f].splice(+b.dataset.i, 1);
        save();
    }
    else if (act === 'del') {
        askDelete(p);
        return;
    }
    view();
});
const onField = e => {
    const t = e.target, p = cur();
    if (!p || S.view === 'new')
        return;
    if (t.dataset.mem)
        p.member = t.value;
    else if (t.dataset.k)
        p.data[t.dataset.k] = t.value;
    else if (t.dataset.m) {
        const a = new Set(p.data[t.dataset.m] || []);
        t.checked ? a.add(t.value) : a.delete(t.value);
        p.data[t.dataset.m] = [...a];
    }
    else if (t.dataset.l) {
        const l = p.data[t.dataset.l];
        l[+t.dataset.i][t.dataset.c] = t.value;
    }
    else
        return;
    save();
    if (t.dataset.mem) {
        const c = document.querySelector('.chip[aria-pressed=true]');
        if (c)
            c.textContent = label(p);
        const h = document.querySelector('.card.hd h2');
        if (h)
            h.textContent = label(p);
    }
};
app.addEventListener('input', onField);
app.addEventListener('change', e => { if (e.target.tagName === 'SELECT' && (e.target.dataset.k || e.target.dataset.l))
    onField(e); if (e.target.dataset.k === 'ask') {
    view();
    return;
} if (e.target.id === 'tq' || e.target.id === 'tkf') {
    if (e.target.id === 'tq')
        S.q = e.target.value;
    else
        S.kf = e.target.value;
    view();
    return;
} if (e.target.id === 'ts') {
    const t = (cur().tpls || []).find(x => x.id === e.target.value);
    document.getElementById('tf').innerHTML = t ? t.fields.map((f, i) => '<label>' + esc(f) + '</label><input data-tf="' + i + '">').join('') : '';
} if (e.target.id === 'tlf')
    document.getElementById('tfn').textContent = '已选 ' + e.target.files.length + ' 张图片'; if (e.target.name === 'ag') {
    S.draft.age = e.target.value;
} });
acctInit();
A._real = !!A.unlocked;
if (TRIAL)
    A.unlocked = true;
load();
if (S.profiles.length)
    S.view = 'home';
view();
if (INAPP)
    inAppModal();
else if (!A.priv) {
    A.priv = 1;
    saveA();
    privacy();
}
</script><script>
/* 弹窗无障碍：自动补 dialog 语义、聚焦，Esc 关闭 */

function prep(o){if(o.dataset.a11y)return;o.dataset.a11y=1;var m=o.querySelector('.mod')||o;m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');var h=m.querySelector('h2,h3,b');if(h){h.id=h.id||('dlg'+Date.now());m.setAttribute('aria-labelledby',h.id);}var f=m.querySelector('button,textarea,input');if(f)setTimeout(function(){try{f.focus({preventScroll:true})}catch(e){}},30);}
new MutationObserver(function(){document.querySelectorAll('.ov').forEach(prep)}).observe(document.body,{childList:true,subtree:true});
