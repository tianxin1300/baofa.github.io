<style>
:root{--bg:#f2f6f6;--card:#fff;--ink:#16282c;--mute:#5d7075;--line:#d5e0e1;--c:#0f766e;--r:12px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a1c;--card:#182427;--ink:#e6f0f1;--mute:#93a8ac;--line:#2b3c40}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 140px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;max-width:100%}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--c);background:var(--c);color:#fff}
.chip.add{border-style:dashed;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.hd{border-left:5px solid var(--c)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--c);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--bg)}
.checks input{width:auto}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg)}
.item .row{margin-bottom:6px}.item input,.item select{background:var(--card)}
button.btn{font:inherit;border:0;border-radius:8px;padding:9px 16px;background:var(--c);color:#fff;cursor:pointer}
button.ghost{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.del{color:#E05252;border-color:#E05252}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);padding:12px 14px;font:inherit;cursor:pointer;border-left:6px solid var(--c)}
.opt small{display:block;color:var(--mute)}
.opt[aria-pressed=true]{background:var(--bg);border-color:var(--c)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.saved{font-size:13px;color:var(--mute)}
.empty{text-align:center;padding:36px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:999px;padding:10px 18px;z-index:10;display:flex;gap:12px;align-items:center}.toast button{background:none;border:0;color:#7fd3ff;font:inherit;font-weight:700;cursor:pointer;min-height:36px}
.pvdoc{display:none}body.pvmode{background:#fff}body.pvmode main{display:none}
body.pvmode .pvdoc{display:block;background:#fff;color:#111;padding:16px;max-width:720px;margin:0 auto}
.pvdoc .sm{font-size:17px}.pvdoc .sm h3{color:#0f5132}.pvimg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pvimg img{width:100%;border:1px solid #ccc;break-inside:avoid}
@media print{.noprint{display:none!important}.pvdoc{padding:0}}
.tab{padding:0 2px;font-size:16px}
.sm{font-size:19px;line-height:1.75}.sm h3{font-size:19px;margin:16px 0 4px;color:var(--c)}.sm ul{margin:0;padding-left:22px}.sm li{margin-bottom:4px}
.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.mod{background:var(--card);color:var(--ink);border-radius:var(--r);padding:18px;max-width:420px;width:100%}.mod textarea{min-height:200px}
.warn{color:#b42318;font-size:15px}.lockb{width:100%;margin:6px 0 10px}
@media print{.chips,.tabs,.acct,button,.seg{display:none}}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tab{font:inherit;font-weight:600;min-height:52px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);cursor:pointer}
.tab[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg .chip{flex:1;min-height:48px}
input,select,textarea{min-height:48px;font-size:17px}
input[type=checkbox],input[type=radio]{min-height:0;width:20px;height:20px}
button.btn,button.ghost{min-height:48px}.chip{min-height:44px}
.tlh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px}
.tlt{white-space:pre-wrap;margin:6px 0 10px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
.val{font-size:26px;font-weight:700}.val small{font-size:14px;font-weight:400;color:var(--mute)}
.bad{color:#dc2626}.ch{width:100%;height:auto;color:var(--mute);margin:6px 0 10px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
details{margin-top:12px}summary{cursor:pointer;min-height:44px;line-height:44px}
.foot{font-size:14px;color:var(--mute)}.emg{border:1.5px solid #dc2626;border-radius:8px;padding:10px 14px;color:var(--ink)}.emg ul{margin:6px 0 0;padding-left:20px}

</style></head><body><main id="app"></main>
<script>
const COL={tumor:'#7c3a8c',breast:'#be3a6e',lymphoma:'#6d3a8c',myeloma:'#8a3a6d',leukemia:'#a3304f',auto:'#2f7d6d',ckd:'#3a6ea5',colorectal:'#8b5a2b',lung:'#4a5d7e',hyper:'#2D6B8F',diabetes:'#1d5fb8',rare:'#0f766e'};
const T=[{k:'type',l:'类型',o:['手术','化疗','免疫','靶向','内分泌治疗','放疗','其他']}];
const TGT={k:'targets',t:'list',l:'自定义指标目标',add:'添加指标',cols:[{k:'name',l:'指标名称',ph:'如 体重'},{k:'val',l:'目标值',ph:'如 ≤65 kg'}]};
const BASE=[{k:'diag',t:'date',l:'诊断时间'},{k:'hosp',t:'text',l:'就诊医院'},{k:'dept',t:'text',l:'主治科室'}];
const D={
tumor:{n:'肿瘤',d:'乳腺癌、结直肠癌、肺癌、淋巴瘤、白血病等，含病理、分期、治疗方案',f:[...BASE,{k:'path',t:'area',l:'病理结论'},{k:'stage',t:'text',l:'分期',ph:'如 T2N1M0 / III期'},{k:'tx',t:'multi',l:'治疗方案',o:['手术','化疗','免疫','靶向']},TGT]},
breast:{n:'乳腺癌',d:'确诊、分型、分期、既往治疗',f:[{k:'diag',t:'date',l:'确诊时间'},{k:'hosp',t:'text',l:'就诊医院'},{k:'dept',t:'text',l:'主治科室'},{k:'sub',t:'sel',l:'病理分型',o:['Luminal A型','Luminal B型(HER2阴性)','Luminal B型(HER2阳性)','HER2过表达型','三阴性','暂不明确']},{k:'stage',t:'sel',l:'分期',o:['0期','I期','II期','III期','IV期','暂不明确']},{k:'hist',t:'list',l:'既往治疗记录',add:'添加治疗记录',cols:[{k:'type',l:'治疗类型',sel:['手术','化疗','靶向','内分泌治疗','放疗','其他']},{k:'date',l:'开始日期',date:1},{k:'note',l:'方案/药物/备注',ph:'如 TC方案 4周期'}]},TGT]},
colorectal:{n:'结直肠癌',d:'',f:[...BASE,{k:'site',t:'sel',l:'肿瘤部位',o:['结肠','乙状结肠','直肠','其他']},{k:'path',t:'area',l:'病理类型'},{k:'stage',t:'text',l:'分期',ph:'如 T3N1M0 / III期'},{k:'mol',t:'area',l:'分子检测结果',ph:'如 MSI/MMR、RAS、BRAF'},{k:'ost',t:'sel',l:'造口情况',o:['无造口','临时造口','永久造口']},{k:'hist',t:'list',l:'治疗记录',add:'添加治疗记录',cols:[{k:'type',l:'治疗类型',sel:['手术','化疗','放疗','靶向','免疫','其他']},{k:'date',l:'开始日期',date:1},{k:'note',l:'方案/药物/备注',ph:'如 具体方案、周期数'}]},TGT]},
lung:{n:'肺癌',d:'',f:[...BASE,{k:'ptype',t:'sel',l:'病理类型',o:['腺癌','鳞癌','小细胞肺癌','其他']},{k:'stage',t:'text',l:'分期',ph:'如 T2N0M0 / IB期'},{k:'gene',t:'area',l:'基因检测结果',ph:'如 EGFR、ALK、ROS1、KRAS'},{k:'pdl1',t:'text',l:'PD-L1 表达',ph:'如 TPS 50%'},{k:'hist',t:'list',l:'治疗记录',add:'添加治疗记录',cols:[{k:'type',l:'治疗类型',sel:['手术','化疗','放疗','靶向','免疫','其他']},{k:'date',l:'开始日期',date:1},{k:'note',l:'方案/药物/备注',ph:'如 具体方案、周期数'}]},TGT]},
hyper:{n:'高血压',d:'收缩压、舒张压控制目标',f:[...BASE,{k:'sbp',t:'num',l:'收缩压控制目标 (mmHg)',ph:'如 130'},{k:'dbp',t:'num',l:'舒张压控制目标 (mmHg)',ph:'如 80'},TGT]},
diabetes:{n:'糖尿病',d:'空腹、餐后2h血糖目标',f:[...BASE,{k:'fbg',t:'text',l:'空腹血糖目标 (mmol/L)',ph:'如 4.4–7.0'},{k:'pbg',t:'text',l:'餐后2h血糖目标 (mmol/L)',ph:'如 <10.0'},TGT]},
rare:{n:'罕见病',d:'基因检测、会诊、发育评估',f:[...BASE,{k:'gene',t:'area',l:'基因检测结果'},{k:'cHosp',t:'text',l:'确诊医院'},{k:'gc',t:'list',l:'遗传咨询记录',add:'添加咨询记录',cols:[{k:'date',l:'日期',date:1},{k:'note',l:'咨询要点',ph:'咨询机构、结论、建议'}]},{k:'mdt',t:'list',l:'多科室会诊记录',add:'添加会诊记录',cols:[{k:'date',l:'日期',date:1},{k:'dept',l:'参与科室',ph:'如 神经科、康复科'},{k:'note',l:'会诊意见'}]},{k:'dev',t:'area',l:'发育评估基线',kid:1,ph:'如 评估量表、日期、粗大运动/语言/认知水平'},TGT]}
};
const TXL=o=>({k:'hist',t:'list',l:'治疗记录',add:'添加治疗记录',cols:[{k:'type',l:'治疗类型',sel:o},{k:'date',l:'开始日期',date:1},{k:'note',l:'方案/药物/剂量',ph:'如 具体方案、周期数'}]});
D.lymphoma={n:'淋巴瘤',d:'',f:[...BASE,{k:'ptype',t:'sel',l:'病理类型',o:['霍奇金淋巴瘤','弥漫大B细胞淋巴瘤','滤泡性淋巴瘤','其他非霍奇金淋巴瘤','暂不明确']},{k:'stage',t:'text',l:'分期',ph:'如 Ann Arbor III期A'},{k:'ihc',t:'area',l:'免疫组化 / 分子检测结果'},{k:'bm',t:'area',l:'骨髓检查结果'},TXL(['化疗','免疫治疗','靶向','放疗','造血干细胞移植','其他']),TGT]};
D.myeloma={n:'多发性骨髓瘤',d:'',f:[...BASE,{k:'mtype',t:'sel',l:'分型',o:['IgG型','IgA型','轻链型','非分泌型','其他','暂不明确']},{k:'stage',t:'text',l:'分期',ph:'如 ISS / R-ISS 分期'},{k:'fish',t:'area',l:'细胞遗传学 / FISH 结果'},{k:'bone',t:'area',l:'骨病变情况'},TXL(['化疗','靶向','免疫调节剂','单克隆抗体','放疗','造血干细胞移植','其他']),TGT]};
D.leukemia={n:'白血病',d:'',f:[...BASE,{k:'ltype',t:'sel',l:'类型',o:['急性髓系白血病','急性淋巴细胞白血病','慢性髓系白血病','慢性淋巴细胞白血病','其他']},{k:'risk',t:'text',l:'危险分层',ph:'按医生所告知填写'},{k:'gene',t:'area',l:'染色体 / 融合基因结果',ph:'如 BCR-ABL 等'},{k:'bm',t:'area',l:'骨髓检查结果'},TXL(['化疗','靶向','免疫治疗','造血干细胞移植','放疗','其他']),TGT]};
D.auto={n:'自身免疫病',d:'红斑狼疮、类风湿关节炎等，含抗体、受累脏器、用药',f:[...BASE,{k:'which',t:'sel',l:'具体疾病',o:['系统性红斑狼疮','类风湿关节炎','干燥综合征','强直性脊柱炎','血管炎','重症肌无力','其他']},{k:'ab',t:'area',l:'自身抗体结果',ph:'如 ANA、抗dsDNA、RF、抗CCP 等'},{k:'organ',t:'area',l:'受累脏器记录'},{k:'hist',t:'list',l:'治疗用药记录',add:'添加用药记录',cols:[{k:'type',l:'药物类别',sel:['糖皮质激素','免疫抑制剂','生物制剂','羟氯喹','其他']},{k:'date',l:'开始日期',date:1},{k:'note',l:'药名、剂量、调整情况'}]},TGT]};
D.ckd={n:'慢性肾病',d:'肌酐、eGFR、尿蛋白、透析与用药',f:[...BASE,{k:'cause',t:'text',l:'原发病 / 病因',ph:'按医生所告知填写'},{k:'cstage',t:'sel',l:'CKD 分期',o:['1期','2期','3期','4期','5期','暂不明确']},{k:'rrt',t:'sel',l:'肾脏替代治疗',o:['未透析','血液透析','腹膜透析','肾移植后']},{k:'hist',t:'list',l:'用药与治疗记录',add:'添加记录',cols:[{k:'type',l:'类别',sel:['降压药','降尿蛋白药','免疫抑制 / 激素','促红素 / 铁剂','降磷 / 钙剂','透析相关','其他']},{k:'date',l:'开始日期',date:1},{k:'note',l:'药名、剂量、调整情况'}]},TGT]};
let S={profiles:[],cur:null,view:'list',draft:{},tab:"info",range:"all",q:"",kf:"",edit:null,mxe:null},mem=null;
let LOCK=0,BADOK=false,DIRTY=0;
function load(){try{const r=localStorage.getItem('companion.v1');if(r){let v;try{v=JSON.parse(r)}catch(e){v=null}
if(Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&['tl','mx','orders','tpls'].every(k=>x[k]===undefined||Array.isArray(x[k]))&&typeof x.id==='string'&&Object.prototype.hasOwnProperty.call(D,x.disease)&&x.data&&typeof x.data==='object'))S.profiles=v;
else{LOCK=1;try{localStorage.setItem('companion.v1.bad',r);BADOK=localStorage.getItem('companion.v1.bad')===r}catch(e2){BADOK=false}alert('本机档案数据读取异常，已进入保护模式：新增和修改都不会保存，以免覆盖原数据。'+(BADOK?'原始数据已另存一份。':'原始数据另存失败，请不要清理浏览器数据。')+'请从备份恢复，或在页面顶部选择放弃异常数据。')}}}catch(e){if(mem)S.profiles=mem;else{let w=false;try{localStorage.setItem('companion.t2','1');localStorage.removeItem('companion.t2');w=true}catch(e3){}if(w){LOCK=1;BADOK=false;alert('本机档案读取失败，已进入保护模式，不会写入新数据。请从备份恢复，或刷新重试。')}}}
S.profiles.forEach(p=>{if(p.disease==='tumor'&&SUBD[p.sub]){p.disease=SUBD[p.sub];delete p.sub}});if(S.profiles.length)S.cur=S.profiles[0].id}
let SFW=0;function storeFail(){STO=false;if(!SFW){SFW=1;alert('保存失败：浏览器无法写入本机存储（可能是空间不足、无痕模式或被禁用）。请立即导出备份，并换用 Safari / Chrome 的正常模式。')}}
function failToast(){const t=document.createElement('div');t.className='toast';t.style.background='#b42318';t.textContent='⚠️ 保存失败，请立即导出备份';document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}
function save(){if(LOCK){DIRTY=0;const s0=document.getElementById('sv');if(s0){s0.textContent='⚠️ 数据异常保护中，未保存';s0.style.color='#E05252'}return false}
mem=S.profiles;let ok=true;try{localStorage.setItem('companion.v1',JSON.stringify(S.profiles))}catch(e){ok=false;storeFail();failToast()}DIRTY=ok?0:1;
const s=document.getElementById('sv');if(s){s.textContent=ok?'已保存在本机 '+new Date().toTimeString().slice(0,5):'⚠️ 保存失败，请立即导出备份';s.style.color=ok?'':'#E05252'}return ok}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>S.profiles.find(p=>p.id===S.cur);
const label=p=>p.member+' · '+dn(p)+(p.disease==='rare'?(p.age==='child'?'(儿童)':'(成人)'):'');
function chips(){return `<div class="chips">${S.profiles.map(p=>`<button class="chip" aria-pressed="${S.view==='list'&&p.id===S.cur}" data-act="pick" data-id="${p.id}" style="--c:${COL[p.disease]}">${esc(label(p))}</button>`).join('')}<button class="chip add" data-act="new">＋ 新建档案</button></div>`}
function field(f,p){const v=p.data[f.k];
if(f.kid&&p.age!=='child')return'';
const L=`<label>${f.l}</label>`;
if(f.t==='text'||f.t==='date'||f.t==='num')return L+`<input data-k="${f.k}" type="${f.t==='num'?'number':f.t==='date'?'date':'text'}" ${f.t==='num'?'inputmode="numeric"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
if(f.t==='area')return L+`<textarea data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
